name: CI
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - name: Ensure external media and PDF tools
        run: |
          if ! command -v ffmpeg || ! command -v ffprobe || ! command -v pdfinfo || ! command -v pdftotext || ! command -v bwrap; then
            for source in /etc/apt/apt-mirrors.txt /etc/apt/apt-mirrors-security.txt /etc/apt/sources.list.d/ubuntu.sources; do
              if [ -f "$source" ]; then
                sudo sed -i 's@http://azure.archive.ubuntu.com/ubuntu@https://archive.ubuntu.com/ubuntu@g' "$source"
              fi
            done
            timeout 180s sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update
            timeout 180s sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 install -y --no-install-recommends ffmpeg poppler-utils bubblewrap
          fi
      - run: cargo fmt --all --check
      - run: cargo fmt --manifest-path integrations/hymt-bridge/Cargo.toml --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --manifest-path integrations/hymt-bridge/Cargo.toml --all-targets -- -D warnings
      - run: cargo build --locked --manifest-path integrations/hymt-bridge/Cargo.toml
      - run: cargo test --locked --manifest-path integrations/hymt-bridge/Cargo.toml
      - run: cargo test --locked
      - run: cargo build --locked --release
      - run: cargo build --locked --release --manifest-path integrations/hymt-bridge/Cargo.toml
