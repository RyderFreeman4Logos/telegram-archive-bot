[workspace]
members = ["."]
resolver = "2"

[package]
name = "telegram-archive-bot"
version = "0.1.0-rc.3"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
description = "Recoverable Telegram archiving and validated audio delivery"
repository = "https://github.com/RyderFreeman4Logos/telegram-archive-bot"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
url = { version = "2", features = ["serde"] }
rusqlite = { version = "=0.32.1", features = ["bundled", "backup"] }
fs2 = "0.4"
tempfile = "3"
libc = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "signal", "time", "sync", "fs", "io-util", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart", "stream"] }
futures-util = "0.3"
dom_smoothie = "=0.18.2"
htmd = "=0.5.6"
encoding_rs = "0.8"
adk-core = "=2.3.0"
adk-graph = { version = "=2.3.0", features = ["sqlite"] }
adk-model = { version = "=2.3.0", default-features = false, features = ["openai"] }
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"] }
async-trait = "0.1"

[profile.release]
strip = true

[[example]]
name = "deliver_pending"
test = true

[[example]]
name = "prepare_media"
test = true
